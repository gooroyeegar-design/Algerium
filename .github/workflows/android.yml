name: Build Algerium APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip -d $HOME/gradle
          echo "$HOME/gradle/gradle-8.11.1/bin" >> $GITHUB_PATH
      - name: Security source gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'android\\.webkit\\.WebView|addJavascriptInterface|Runtime\\.getRuntime|ProcessBuilder|android\\.permission\\.(READ|WRITE)_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE' app/src/main; then
            echo "Forbidden browser/security API detected"
            exit 1
          fi
          grep -q 'android:isolatedProcess="true"' app/src/main/AndroidManifest.xml
          grep -q 'android:exported="false"' app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -q 'networkSecurityConfig="@xml/network_security_config"' app/src/main/AndroidManifest.xml
          echo "Security source gate passed"
      - run: gradle testDebugUnitTest --stacktrace
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Algerium-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
