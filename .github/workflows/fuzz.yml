name: Algerium parser fuzz
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang and cmake
        run: sudo apt-get update && sudo apt-get install -y clang cmake
      - name: Build fuzz target
        run: |
          cmake -S engine -B build-fuzz -DALGERIUM_ENGINE_TESTS=OFF -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer"
          cmake --build build-fuzz --parallel
          clang++ -std=c++20 -fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer engine/tests/parser_fuzz.cpp build-fuzz/libalgerium_engine.a -Iengine/include -o build-fuzz/algerium_parser_fuzz
      - name: Short fuzz run
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: build-fuzz/algerium_parser_fuzz -max_total_time=30 -max_len=262144
